name: ci

on:
  push:
  pull_request:

# Superseded runs cancel instead of piling up; a "cancelled" job then
# unambiguously means a newer run took its place.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned runner for reproducible builds; ubuntu-latest floats across releases.
# Note: runs #4-6 (Oct 2026) failed with GitHub-hosted runner acquisition
# errors ("job was not acquired by Runner of type hosted") plus an internal
# server error. Those are GitHub infrastructure failures, not Provena failures.

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "pip-audit>=2.9,<3"
      - run: python -m pip_audit -r backend/requirements.txt

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provena_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: provena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provena_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://provena_ci:synthetic_ci_only@127.0.0.1:5432/provena_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest tests/test_postgres_evidence.py -q
        working-directory: backend
        env:
          M1_POSTGRES_TEST_URL: postgresql+psycopg2://provena_ci:synthetic_ci_only@127.0.0.1:5432/provena_ci

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
