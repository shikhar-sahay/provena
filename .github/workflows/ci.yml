name: ci

on:
  push:
  pull_request:

# Superseded runs cancel instead of piling up; a "cancelled" job then
# unambiguously means a newer run took its place.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned runner for reproducible builds; ubuntu-latest floats across releases.
# Note: runs #4-6 (Oct 2026) failed with GitHub-hosted runner acquisition
# errors ("job was not acquired by Runner of type hosted") plus an internal
# server error. Those are GitHub infrastructure failures, not Provena failures.

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
