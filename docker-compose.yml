# Local development stack: Postgres + API + Vite dev server.
# Database, original evidence and expiring export artifacts use distinct volumes.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provena
      POSTGRES_PASSWORD: provena
      POSTGRES_DB: provena
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - provena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provena -d provena"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.ops.preflight --database --storage && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://provena:provena@db:5432/provena
      CORS_ORIGINS: http://localhost:5173
      EVIDENCE_STORAGE_ROOT: /evidence
      EXPORT_STORAGE_ROOT: /exports
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - provena_evidence:/evidence
      - provena_exports:/exports
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  provena_pgdata:
  provena_evidence:
  provena_exports:
